<!DOCTYPE html>
<html lang="es" id="html-tag">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portafolio de soluciones tecnológicas IICA</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="app-container">
    <header class="header">
    <div class="header-content">
        <div class="header-item left">
            <img src="logo-iica.svg" alt="IICA" class="header-logo-iica">
        </div>

        <div class="header-item center">
            <span class="header-title" data-i18n="app_title">InnovaJoven</span>
        </div>

        <div class="header-item right">
            <img src="logo-app.png" alt="Logo InnovaJoven" class="header-logo-app">
        </div>
    </div>
</header>

    <div id="view-catalog" class="view active">
        <h2 class="view-title" data-i18n="catalog_title">Catálogo de soluciones</h2>
        <div class="filter-bar">
            <input type="text" class="search-input" id="search-input" data-i18n-placeholder="search_placeholder" placeholder="🔍 Buscar proyecto..." oninput="renderCatalog()">
            
            <select id="category-filter" class="category-select" onchange="renderCatalog()">
                <option value="all" data-i18n="cat_all">Todas las categorías</option>
                <option value="cat-ciencia" data-i18n="cat_science">Ciencia y Tecnología</option>
                <option value="cat-comercio" data-i18n="cat_commerce">Comercio y Valor</option>
            </select>
        </div>
        <div id="catalog-container"></div>
    </div>

    <div id="view-projects" class="view">
        <h2 class="view-title" data-i18n="dash_title">Proyectos en desarrollo</h2>
        
        <div id="enrolled-container"></div>

        <div class="empty-state" id="empty-projects">
            <p data-i18n="dash_empty">No tienes proyectos inscritos</p>
            <button class="btn btn-primary" onclick="switchNav('view-catalog', 0)" style="width: auto; padding: 8px 16px; margin: 0 auto;" data-i18n="btn_explore">Explorar Catálogo</button>
        </div>
    </div>

    <div id="view-settings" class="view">
        <h2 class="view-title" data-i18n="settings_title">Mi Perfil y Ajustes</h2>
        
        <div class="card">
            <h3 class="card-title" style="margin-bottom: 15px;" data-i18n="settings_prefs">Preferencias de la App</h3>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <span style="color: var(--text-main); font-weight: 500;" data-i18n="settings_lang">Idioma / Language</span>
                <select id="langSelect" onchange="changeLanguage(this.value)" class="lang-select">
                    <option value="es">Español</option>
                    <option value="en">English</option>
                    <option value="pt">Português</option>
                </select>
            </div>
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <span style="color: var(--text-main); font-weight: 500;" data-i18n="settings_dark">Modo Oscuro (Nocturno)</span>
                <input type="checkbox" style="width: 20px; height: 20px;" id="darkModeToggle">
            </div>
        </div>
    </div>

    <div id="view-course" class="view">
        <div class="course-header">
            <button onclick="switchNav('view-projects', 1)" class="btn-back" data-i18n="course_back">⬅ Volver a mis proyectos</button>
            <br>
            <span id="course-category" class="category-pill">Categoría</span>
            <h2 id="course-title" style="margin:8px 0 5px 0; color: var(--text-main); font-weight: 700;">Título</h2>
            
            <a href="#" download class="btn btn-pdf" id="btn-download" data-i18n="course_download">
                ⬇️ Descargar Manual Completo
            </a>

            <div class="progress-container">
                <div style="display: flex; justify-content: space-between; font-size: 0.9rem; font-weight:bold; color: var(--primary);">
                    <span data-i18n="course_progress">Tu avance en la guía:</span>
                    <span id="course-progress-text">0%</span>
                </div>
                <div class="progress-bar"><div class="progress-fill" id="course-progress-fill"></div></div>
            </div>
        </div>

        <h3 style="color: var(--text-main); font-size: 1.1rem; margin-bottom: 15px; font-weight: 500;" data-i18n="course_route">Ruta de Implementación</h3>
        <ul class="module-list" id="dynamic-module-list"></ul>

        <div class="danger-zone">
        <button class="btn-ghost-danger" onclick="unenrollCourse()" data-i18n="btn_unenroll">
            ❌ Abandonar Proyecto
        </button>
    </div>
    </div>

    <nav class="bottom-nav">
        <button class="nav-btn active" onclick="switchNav('view-catalog', 0)"><span style="font-size: 1.2rem;">📚</span> <span data-i18n="nav_catalog">Catálogo</span></button>
        <button class="nav-btn" onclick="switchNav('view-projects', 1)"><span style="font-size: 1.2rem;">📁</span> <span data-i18n="nav_projects">Mis Proyectos</span></button>
        <button class="nav-btn" onclick="switchNav('view-settings', 2)"><span style="font-size: 1.2rem;">⚙️</span> <span data-i18n="nav_settings">Ajustes</span></button>
    </nav>

</div>

<script src="translations.js"></script>
<script src="app.js"></script>

</body>
</html>
